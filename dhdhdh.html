
<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M5Stick Plus</title>
<style>
body {
  background:#111;
  color:#b7ff38;
  font-family:monospace;
  text-align:center;
  padding:20px;
}
.screen {
  max-width:300px;
  margin:30px auto;
  padding:20px;
  border:5px solid #444;
  border-radius:20px;
  background:#050805;
  min-height:330px;
}
h1 {font-size:35px}
button {
  background:#b7ff38;
  color:#111;
  border:0;
  padding:12px;
  margin:5px;
  font-weight:bold;
  cursor:pointer;
}
p {color:white}
</style>
</head>
<body>
<div class="screen">
  <h3>M5STICK PLUS</h3>
  <p>BATTERY: 87% 🔋</p>
  <h1 id="clock">00:00</h1>
  <p id="date">SYSTEM READY</p>
  <hr>
  <button onclick="show('STATUS')">STATUS</button>
  <button onclick="show('TOOLS')">TOOLS</button>
  <button onclick="show('ABOUT')">ABOUT</button>
  <p id="output">SYSTEM READY</p>
</div>
<script>
function update() {
  let d = new Date();
  document.getElementById('clock').textContent =
    d.toLocaleTimeString([], {
      hour:'2-digit', minute:'2-digit'
    });
  document.getElementById('date').textContent =
    d.toLocaleDateString();
}
function show(page) {
  document.getElementById('output').textContent =
    page === 'STATUS' ? 'SYSTEM ONLINE' :
    page === 'TOOLS' ? 'TOOLS MENU OPEN' :
    'M5STICK PLUS WEB UI v1.0';
}
update();
setInterval(update,1000);
</script>
</body>
</html>
